< !DOCTYPE html><html lang="fr"><head><meta charset="utf-8" /><meta content="width=device-width, initial-scale=1.0" name="viewport" /><title>SEO On-Page - Checklist</title><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" /><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet" /><style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #0f172a;
    overflow: hidden;
    width: 1280px;
    height: 720px;
}

.slide-container {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
}

.bg-pattern {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        radial-gradient(circle at 20% 80%, rgba(37, 99, 235, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(249, 115, 22, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(16, 185, 129, 0.05) 0%, transparent 50%);
    z-index: 1;
}

.grid-lines {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: 1;
}

.content-wrapper {
    position: relative;
    z-index: 10;
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    padding: 40px 50px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 25px;
}

.title-section {
    display: flex;
    align-items: center;
    gap: 20px;
}

.title-icon {
    width: 60px;
    height: 60px;
    background: linear-gradient(135deg, #2563EB, #1d4ed8);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 26px;
}

.main-title {
    font-size: 38px;
    font-weight: 700;
    color: white;
    margin-bottom: 2px;
    line-height: 1.1;
}

.subtitle {
    font-size: 16px;
    color: #94a3b8;
}

.badge {
    background: rgba(249, 115, 22, 0.2);
    color: #F97316;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 15px;
    font-weight: 600;
    border: 1px solid rgba(249, 115, 22, 0.3);
}

.main-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    flex: 1;
}

.checklist-column {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.checklist-card {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
}

.card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.card-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
}

.card-icon.blue {
    background: rgba(37, 99, 235, 0.2);
    color: #3B82F6;
}

.card-icon.green {
    background: rgba(16, 185, 129, 0.2);
    color: #10B981;
}

.card-icon.orange {
    background: rgba(249, 115, 22, 0.2);
    color: #F97316;
}

.card-icon.purple {
    background: rgba(139, 92, 246, 0.2);
    color: #8B5CF6;
}

.card-title {
    color: white;
    font-size: 16px;
    font-weight: 600;
}

.checklist-items {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.checklist-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.checkbox.checked {
    background: #10B981;
    border-color: #10B981;
}

.checkbox i {
    color: white;
    font-size: 11px;
}

.item-content {
    flex: 1;
}

.item-title {
    color: white;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 1px;
}

.item-desc {
    color: #94a3b8;
    font-size: 12px;
    line-height: 1.2;
}

.priority-badge {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    min-width: 60px;
    text-align: center;
}

.priority-badge.high {
    background: rgba(239, 68, 68, 0.2);
    color: #EF4444;
}

.priority-badge.medium {
    background: rgba(249, 115, 22, 0.2);
    color: #F97316;
}

.priority-badge.low {
    background: rgba(16, 185, 129, 0.2);
    color: #10B981;
}

.progress-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
}

.progress-info {
    display: flex;
    align-items: center;
    gap: 15px;
    color: #94a3b8;
    font-size: 14px;
    flex: 1;
    max-width: 600px;
}

.progress-bar {
    flex: 1;
    height: 8px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 4px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #3B82F6, #10B981);
    border-radius: 4px;
}

.action-buttons {
    display: flex;
    gap: 12px;
}

.action-btn {
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
}

.action-btn.primary {
    background: #3B82F6;
    color: white;
}

.action-btn.secondary {
    background: rgba(255, 255, 255, 0.1);
    color: white;
}

</style></head><body><div class="slide-container"><div class="bg-pattern"></div><div class="grid-lines"></div><div class="content-wrapper">< !-- Header --><div class="header"><div class="title-section"><div class="title-icon"><i class="fas fa-check-square"></i></div><div><div class="main-title">SEO On-Page - Checklist</div><div class="subtitle">Optimisation on-page complète pour le référencement</div></div></div><div class="badge"><i class="fas fa-clipboard-check" style="margin-right: 8px;"></i>12 éléments </div></div>< !-- Main Content --></div></div></body></html>
